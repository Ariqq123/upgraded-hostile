# ========================
# UpgradedHostile Config
# ========================
# Set 'enabled: false' on any mob section to disable its AI.
# Set 'enabled: false' in general section to disable bleeding effects.

general:
  # Enable debug logging in the console
  debug: false
  # Chance for a player to start bleeding when hit by a mob
  bleed-chance: 0.15
  # Duration of the bleeding effect (20 ticks = 1 second)
  bleed-duration-ticks: 200
  # Area Evolution: Mobs become smarter in high-kill chunks
  evolution-enabled: true

# --- Zombie Block Breaking ---
zombie:
  enabled: true
  # How many hits before a block breaks (each hit = 1 task tick)
  break-hits: 10
  # How often the zombie task runs (in ticks, 20 ticks = 1 second)
  check-interval-ticks: 10
  # Max distance to player before zombie tries to break blocks
  detection-range: 4.0
  # Min distance — below this the zombie can already melee, no need to break
  min-range: 1.2
  # Time in milliseconds before a partially-damaged block resets (zombie died/left)
  stale-timeout-ms: 10000
  # --- Smell Blood ---
  # Range within which zombies detect bleeding players
  blood-smell-range: 64.0
  # Speed boost when chasing a bleeding player
  blood-smell-speed: 0.35
  # Normal speed to reset to
  normal-speed: 0.23
  # --- Builder AI ---
  # Can zombies pick up broken blocks?
  can-pickup-blocks: true
  # Can zombies use blocks to tower up to players?
  can-tower: true
  # Can zombies place blocks to bridge gaps?
  can-bridge: true
  # Can zombies break nearby torches when idle?
  can-snuff-torches: true

# --- Creeper Stealth & Surprise ---
creeper:
  enabled: true
  # How often the creeper task runs (in ticks)
  check-interval-ticks: 5
  # Speed when player IS looking at the creeper (normal is 0.25)
  slow-speed: 0.2
  # Speed when player is NOT looking (stalking speed)
  fast-speed: 0.4
  # Default speed to reset to when idle
  normal-speed: 0.25
  # Fuse ticks for surprise attack (default vanilla is 30)
  surprise-fuse-ticks: 10
  # Normal fuse ticks (reset value)
  normal-fuse-ticks: 30
  # Distance threshold to trigger surprise ignition
  surprise-range: 2.5
  # Dot product threshold for "player is looking at creeper" (0.7 ≈ 45° FOV)
  looking-at-threshold: 0.7
  # Fuse ticks when in a Territorial Rage chunk (even shorter than surprise)
  rage-fuse-ticks: 5

# --- Skeleton Tactical Shooter ---
skeleton:
  enabled: true
  check-interval-ticks: 5
  # Speed when strafing to dodge arrows
  strafe-speed: 0.35
  # Normal speed to reset to
  normal-speed: 0.25
  # Max distance to seek cover from player
  cover-seek-range: 8.0
  # Distance at which skeleton starts strafing when player aims a bow
  strafe-bow-distance: 12.0
  # Can skeletons seek out and mount nearby spiders?
  can-dynamic-jockey: true
  # Can skeletons break nearby torches when idle?
  can-snuff-torches: true

# --- Spider Ambush Predator ---
spider:
  enabled: true
  check-interval-ticks: 10
  # Max distance for leap attacks
  leap-range: 6.0
  # Velocity multiplier for leap attacks
  leap-velocity: 1.2
  # Max vertical distance for ceiling drop ambush
  ceiling-drop-range: 4.0
  # Health threshold below which spiders place cobwebs when fleeing
  web-health-threshold: 8.0
  # Whether spiders can place temporary cobwebs
  enable-web-trap: true

# --- Phantom Dive Bomber ---
phantom:
  enabled: true
  check-interval-ticks: 5
  # Speed multiplier during dive when player isn't looking up
  speed-boost-multiplier: 1.5
  # Number of hits before a phantom breaks off its attack
  persistence-hits: 3
  # Maximum velocity magnitude to prevent compounding speed (#5)
  max-velocity: 2.0

# --- Enderman Strategic Teleporter ---
enderman:
  enabled: true
  check-interval-ticks: 10
  # Max distance for flank teleport attempts
  flank-range: 10.0
  # Distance within which enderman may place blocks to obstruct
  block-place-range: 3.0
  # Whether endermen can place their held block to obstruct players
  enable-block-weaponization: true

# --- Witch Combat Alchemist ---
witch:
  enabled: true
  check-interval-ticks: 10
  # Distance threshold — witch runs away if player is closer than this
  kite-distance: 8.0
  # Speed when retreating from player
  kite-speed: 0.35
  # Normal speed to reset to
  normal-speed: 0.25
  # Health threshold below which witch prioritizes self-healing
  heal-health-threshold: 13.0

# --- Drowned Harpoon Predator ---
drowned:
  enabled: true
  check-interval-ticks: 10
  # Cooldown between harpoon pulls (ms)
  harpoon-cooldown-ms: 12000
  # Minimum evolution factor required for harpoon usage (0.0 to 1.0)
  min-evolution-factor: 0.4
  # Multiplier for the pull velocity
  pull-strength: 0.3

# --- Territorial Rage System ---
# When a chunk's evolution factor reaches the threshold, all mobs in that chunk
# become "Enraged" — they deal bonus damage, emit a crimson aura, and exhibit
# enhanced AI behaviors (pack howling, offensive webs, instant flanking, etc.)
territorial-rage:
  # Master toggle for the entire Territorial Rage system
  enabled: true
  # Evolution factor required to trigger rage (0.0 – 1.0)
  threshold: 0.6
  # Bonus damage multiplier applied to Rage mob attacks
  damage-multiplier: 1.25
  # Range within which revenge targeting activates when a rage mob is killed (blocks)
  revenge-range: 24.0
  # Pack Howl: range zombies converge from on first player sighting (blocks)
  pack-howl-range: 32.0
  # Whether the crimson particle aura is shown on rage mobs
  aura-particles: true
  # Creeper fuse ticks in rage mode (even shorter than surprise fuse)
  # Note: also set via creeper.rage-fuse-ticks for per-mob override
